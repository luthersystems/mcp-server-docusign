name: CI

# Main's ruleset requires the one gate check, "CI (all required checks)"
# (job ci-all below), not each job by name.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides whether the build and test jobs run. The workflow has no paths
  # filter, so it always starts and the gate below always reports; a
  # docs-only PR skips the jobs here instead (scripts/ci-changes.sh).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.decide.outputs.code }}
    steps:
      # On a pull request this checks out the merge commit. Its first parent
      # is the base branch tip, so depth 2 is enough for the diff.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Test the decision script and the gate's needs list
        run: ./scripts/ci-changes-test.sh
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            ./scripts/ci-changes.sh HEAD^1 HEAD | tee -a "$GITHUB_OUTPUT"
          else
            ./scripts/ci-changes.sh | tee -a "$GITHUB_OUTPUT"
          fi

  lint-and-test:
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Create virtual environment
        run: uv venv --python ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv pip install -e ".[dev]"

      - name: Run ruff linter
        run: |
          uv run ruff check .

      - name: Run ruff formatter check
        run: |
          uv run ruff format --check .

      - name: Run unit tests with pytest
        run: |
          uv run pytest tests/ --ignore=tests/test_integration.py --cov=mcp_server_docusign --cov-report=xml --cov-report=term

      - name: Run integration tests (if secrets available)
        if: env.DS_INTEGRATION_KEY != ''
        env:
          DS_AUTH_BASE: ${{ secrets.DS_AUTH_BASE || 'https://account-d.docusign.com' }}
          DS_INTEGRATION_KEY: ${{ secrets.DS_INTEGRATION_KEY }}
          DS_USER_ID: ${{ secrets.DS_USER_ID }}
          DS_PRIVATE_KEY: ${{ secrets.DS_PRIVATE_KEY }}
          DS_OAUTH_SCOPE: signature impersonation
          DS_TOKEN_EXP_SECS: 3600
        run: |
          uv run pytest tests/test_integration.py -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  build:
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Create virtual environment
        run: uv venv --python 3.11

      - name: Build package
        run: |
          uv pip install build
          uv run python -m build

      - name: Check package
        run: |
          uv pip install twine
          uv run twine check dist/*

  ci-all:
    name: CI (all required checks)
    # always(), so the gate reports on every run. A cancelled or failed job
    # then fails the gate below. A gate that did not run, or was skipped,
    # could count as passing for the required check.
    if: always()
    needs: [changes, lint-and-test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Pass only if the changes job succeeded and every other job succeeded,
      # or was skipped because the changes job said the PR is docs-only
      # (code=false). Any other skip fails, so a job skipped by mistake
      # cannot pass the gate.
      - name: Fail unless every required job passed
        if: >-
          needs.changes.result != 'success'
          || contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled')
          || (needs.changes.outputs.code != 'false' && contains(needs.*.result, 'skipped'))
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON"
          echo "::error::A required CI job failed, was cancelled or was skipped."
          exit 1
      - name: Every required job passed or was skipped as docs-only
        run: echo "ok"
